<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cocktailbar Brise – Berlin</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <script src="js/index.js" defer></script>
    <script src="js/home.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <button class="menu_toggle" id="menu_toggle">☰</button>

        <div class="nav_left" id="nav_left"></div>

        <div class="nav_center">
          <a href="index.html"
            ><img
              id="barlogo"
              src="img/logo.png"
              alt="Cocktailbar Brise Logo"
          /></a>
        </div>

        <div class="nav_right">
          <button id="lang_toggle">EN</button>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1 id="hero_title"></h1>
      </section>

      <section class="about">
        <h2 id="about_title"></h2>
        <p id="about_text"></p>
      </section>

      <section class="reservation about">
        <h2 id="reservation_title"></h2>
        <p id="reservation_text"></p>
        <p class="b">
          <a href="tel:+4917663070383" id="reservation_phone"></a>
        </p>
      </section>

      <section id="hours">
        <h2 id="hours_title"></h2>
        <table id="hours_table"></table>
      </section>
    </main>

    <footer>
      <div class="social-icons">
        <a href="https://www.instagram.com/cocktailbar_brise/" target="_blank"
          ><img src="img/instagram icon.png" alt="Instagram"
        /></a>
        <a
          href="https://www.facebook.com/people/Cocktailbar-Brise/61556129234910/#"
          target="_blank"
          ><img src="img/facebook icon.png" alt="Facebook"
        /></a>
      </div>
      <p>© 2025 Cocktailbar Brise – Berlin</p>
    </footer>
  </body>
</html>
