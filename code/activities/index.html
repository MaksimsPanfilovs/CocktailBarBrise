<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cocktailbar Brise – Berlin</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/activities.css" />
    <script src="../js/index.js" defer></script>
    <script src="../js/activities.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <button class="menu_toggle" id="menu_toggle">☰</button>
        <div class="nav_left" id="nav_left"></div>
        <div class="nav_center">
          <a href="../index.html"
            ><img
              id="barlogo"
              src="../img/logo.png"
              alt="Cocktailbar Brise Logo"
          /></a>
        </div>
        <div class="nav_right">
          <button id="lang_toggle">EN</button>
        </div>
      </nav>
    </header>

    <main>
      <h2 id="activity_title"></h2>

      <div class="row_box">
        <section class="activity darts">
          <h3 id="darts_title"></h3>
          <p id="darts_text"></p>
        </section>

        <section class="activity live">
          <h3 id="live_title"></h3>
          <p id="live_text"></p>
        </section>
      </div>

      <section class="activity party">
        <h3 id="party_title"></h3>
        <p id="party_text"></p>
      </section>
    </main>

    <footer>
      <div class="social-icons">
        <a href="https://www.instagram.com/cocktailbar_brise/" target="_blank">
          <img src="../img/instagram icon.png" alt="Instagram" />
        </a>
        <a
          href="https://www.facebook.com/people/Cocktailbar-Brise/61556129234910/#"
          target="_blank"
        >
          <img src="../img/facebook icon.png" alt="Facebook" />
        </a>
      </div>
      <p>© 2025 Cocktailbar Brise – Berlin</p>
    </footer>
  </body>
</html>
