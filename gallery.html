<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocktailbar Brise – Gallery</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav>
      <!-- Hamburger (only shows on mobile) -->
      <button class="menu-toggle" id="menu-toggle">☰</button>

      <div class="lang en hidden">
        <div class="nav-center">
          <ul>
            <li><a href="menu.html">Drinks menu</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="activities.html">Activities</a></li>
            <li><a href="contacts.html">Contacts</a></li>
            
          </ul>
        </div>
      </div>

      <div class="lang de">
        <div class="nav-center">
          <ul>
            <li><a href="menu.html">Getränkekarte</a></li>
            <li><a href="gallery.html">Galerie</a></li>
             <li><a href="activities.html">Aktivitäten</a></li>
            <li><a href="contacts.html">Kontakt</a></li>
           
          </ul>
        </div>
      </div>

      <div class="nav-left">
        <a href="index.html"><img src="logo.png" alt=""></a>
      </div>
      <div class="nav-right">
        <button id="lang-toggle">EN</button>
      </div>
    </nav>
  </header>

  <main>
    <div class="lang en hidden"><h2 class="a">Gallery</h2></div>
    <div class="lang de"><h2 class="a">Galerie</h2></div>
    <section class="image-slider">
      <button class="prev">&lt;</button>
      <div class="slider-container">
        <img src="fifth.webp" alt="Cocktail 1" class="slide active">
        <img src="second.webp" alt="Cocktail 2" class="slide">
        <img src="third.webp" alt="Cocktail 3" class="slide">
        <img src="fourth.webp" alt="Cocktail 4" class="slide">
        <img src="sixth.webp" alt="Cocktail 6" class="slide">
        <img src="seventh.webp" alt="Cocktail 7" class="slide">
        <img src="eigth.webp" alt="Cocktail 8" class="slide">
        <img src="nineth.webp" alt="Cocktail 9" class="slide">
      </div>
      <button class="next">&gt;</button>
    </section>
  </main>

  <footer>
    <div class="social-icons">
      <a href="https://www.instagram.com/cocktailbar_brise/" target="_blank">
        <img src="instagram icon.png" alt="Instagram">
      </a>
      <a href="https://www.facebook.com/people/Cocktailbar-Brise/61556129234910/#" target="_blank">
        <img src="facebook icon.png" alt="Facebook">
      </a>
    </div>
    <p>© 2025 Cocktailbar Brise – Berlin</p>
  </footer>

  <script>
    // Language toggle
    const toggleButton = document.getElementById("lang-toggle");
    let currentLang = "de";
    toggleButton.textContent = "EN";

    toggleButton.addEventListener("click", () => {
      const enElements = document.querySelectorAll(".lang.en");
      const deElements = document.querySelectorAll(".lang.de");

      if (currentLang === "de") {
        deElements.forEach(el => el.classList.add("hidden"));
        enElements.forEach(el => el.classList.remove("hidden"));
        toggleButton.textContent = "DE";
        currentLang = "en";
      } else {
        enElements.forEach(el => el.classList.add("hidden"));
        deElements.forEach(el => el.classList.remove("hidden"));
        toggleButton.textContent = "EN";
        currentLang = "de";
      }
    });

    // Slider
    const slides = document.querySelectorAll(".slider-container img");
    const prevBtn = document.querySelector(".prev");
    const nextBtn = document.querySelector(".next");
    let currentSlide = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === index);
      });
    }

    prevBtn.addEventListener("click", () => {
      currentSlide = (currentSlide - 1 + slides.length) % slides.length;
      showSlide(currentSlide);
    });

    nextBtn.addEventListener("click", () => {
      currentSlide = (currentSlide + 1) % slides.length;
      showSlide(currentSlide);
    });

    // Mobile hamburger
    
  </script>
  <script>
  // Hamburger: toggle class on <nav>
  const nav = document.querySelector('header nav');
  const menuToggle = document.getElementById('menu-toggle');

  menuToggle.addEventListener('click', () => {
    nav.classList.toggle('is-open');
  });

  // Close menu after clicking a link (nice for mobile)
  document.querySelectorAll('nav .nav-center a').forEach(a => {
    a.addEventListener('click', () => nav.classList.remove('is-open'));
  });
</script>
</body>
</html>
